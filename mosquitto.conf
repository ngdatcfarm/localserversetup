# =================================================================
# Mosquitto MQTT Broker - CFarm Local Server
# Port 1883: Local server (no auth), Port 1884: Devices (auth required)
# =================================================================

# --- Port 1883: Local server (no auth required) ---
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# --- Port 1884: ESP32 devices (auth required) ---
listener 1884 0.0.0.0
protocol mqtt
allow_anonymous false
password_file C:/Local server/passwd.txt

# --- Persistence ---
persistence false

# --- Logging ---
log_dest stdout
log_type error