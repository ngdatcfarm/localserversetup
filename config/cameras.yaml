# Cloudflare Worker relay — optional third notification channel
# See cfarm-relay/README.md for setup. Worker fans out to Telegram (and
# future Discord/Email/APNs). Local WebPush + cloud sync notifications still
# run in parallel — this is a fan-out, not a replacement.
